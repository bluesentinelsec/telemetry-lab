name: Research analysis checks
on:
  pull_request:
    paths:
      - 'scripts/pilot/**'
      - 'scripts/iteration-study/**'
      - '.github/workflows/research-checks.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/pilot/**'
      - 'scripts/iteration-study/**'
      - '.github/workflows/research-checks.yml'
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - run: python -m unittest discover -s scripts/pilot -p 'test_*.py'
      - run: python -m unittest discover -s scripts/iteration-study -p 'test_*.py'
