name: Build Composites

# Build the TTP composites -- multi-step ATT&CK techniques -- across the same
# toolchain/runtime substrate matrix as the primitives. The expanded Linux
# C, C++, Go, and Rust suite adds behavior verification and exact-rule evidence tests; live Falco
# qualification runs on the disposable lab host. Each
# job stages its config's composites into composite-dist/<config>/ and uploads
# an artifact named composite-<config>, consumed by the release workflow.

on:
  push:
    branches: [main]
    paths:
      - 'ttp-composite/**'
      - '.github/workflows/build-composites.yml'
  pull_request:
    paths:
      - 'ttp-composite/**'
      - '.github/workflows/build-composites.yml'
  workflow_dispatch:

jobs:
  coverage-evidence-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m unittest discover -s ttp-composite/linux/coverage -p 'test_*.py' -v
      - run: python -m unittest discover -s ttp-composite/windows/coverage -p 'test_*.py' -v

  linux-c:
    # C composites: compiler held constant (gcc), only the C runtime varies
    # (glibc vs musl), mirroring build-c.yml's Linux axis.
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: linux-glibc
            config: linux-c-glibc
            name: Linux C (glibc)
            packages: ""
          - toolchain: linux-musl
            config: linux-c-musl
            name: Linux C (musl)
            packages: musl-tools

    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake git python3 ${{ matrix.packages }}

      - name: Configure (CMake)
        working-directory: ttp-composite/linux/c
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=toolchains/${{ matrix.toolchain }}.cmake

      - name: Build
        working-directory: ttp-composite/linux/c
        run: cmake --build build

      # A single install stages every composite: each has an install(TARGETS ...
      # RUNTIME DESTINATION .) rule, so they land flat in composite-dist/<config>.
      - name: Stage composites
        working-directory: ttp-composite/linux/c
        run: |
          cmake --install build --prefix ../../../composite-dist/${{ matrix.config }}
          gcc -static -O2 -Wall -Wextra -Werror coverage/helper.c -o ../../../composite-dist/${{ matrix.config }}/falco_helper

      - name: Verify standalone C programs
        run: python3 ttp-composite/linux/coverage/verify_programs.py composite-dist/${{ matrix.config }}/coverage ${{ matrix.toolchain == 'linux-glibc' && 'glibc' || 'musl' }}

      - name: Upload composites
        uses: actions/upload-artifact@v7
        with:
          name: composite-${{ matrix.config }}
          path: composite-dist/${{ matrix.config }}

  linux-cpp:
    # C++ composites: clang++ held constant, only the C++ standard library
    # varies (libstdc++ vs libc++), mirroring build-cpp.yml's Linux axis.
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: linux-libstdcxx
            config: linux-cpp-libstdcxx
            name: Linux C++ (libstdc++)
          - toolchain: linux-libcxx
            config: linux-cpp-libcxx
            name: Linux C++ (libc++)

    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y cmake git clang libc++-dev libc++abi-dev gcc libc6-dev python3 binutils

      - name: Configure (CMake)
        working-directory: ttp-composite/linux/cpp
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=toolchains/${{ matrix.toolchain }}.cmake

      - name: Build
        working-directory: ttp-composite/linux/cpp
        run: cmake --build build

      - name: Stage composites
        working-directory: ttp-composite/linux/cpp
        run: |
          cmake --install build --prefix ../../../composite-dist/${{ matrix.config }}
          gcc -static -O2 -Wall -Wextra -Werror ../c/coverage/helper.c -o ../../../composite-dist/${{ matrix.config }}/falco_helper

      - name: Verify standalone C++ programs and standard library
        run: python3 ttp-composite/linux/coverage/verify_programs.py composite-dist/${{ matrix.config }}/coverage ${{ matrix.toolchain == 'linux-libstdcxx' && 'libstdcxx' || 'libcxx' }}

      - name: Upload composites
        uses: actions/upload-artifact@v7
        with:
          name: composite-${{ matrix.config }}
          path: composite-dist/${{ matrix.config }}

  linux-go:
    # Go composites: the substrate axis is CGO_ENABLED (cgo links the platform C
    # runtime; static is pure-Go), mirroring build-go.yml's Linux axis.
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: linux-go-cgo
            cgo: "1"
            name: Linux Go (cgo)
          - config: linux-go-static
            cgo: "0"
            name: Linux Go (pure-Go static)

    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v7

      # gcc is required by the cgo build; harmless for the static build.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y golang gcc git libc6-dev python3 binutils

      - name: Build and stage composites
        working-directory: ttp-composite/linux/go
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          for p in reverse_shell imds read_sensitive_file symlink_sensitive clear_log mkdir_bin ptrace_antidebug; do
            go build -o ../../../composite-dist/${{ matrix.config }}/$p ./$p
          done
          bash coverage/build.sh ../../../composite-dist/${{ matrix.config }}
          gcc -static -O2 -Wall -Wextra -Werror ../c/coverage/helper.c -o ../../../composite-dist/${{ matrix.config }}/falco_helper
          go vet ./coverage/...

      - name: Upload composites
        uses: actions/upload-artifact@v7
        with:
          name: composite-${{ matrix.config }}
          path: composite-dist/${{ matrix.config }}

  linux-rust:
    # Rust composites: compiler held constant, the libc varies (static glibc vs
    # musl), mirroring build-rust.yml's Linux axis.
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: linux-rust-gnu
            target: x86_64-unknown-linux-gnu
            # glibc discourages static linking; force it so both configs are
            # static and differ only in the libc.
            rustflags: "-C target-feature=+crt-static"
            name: Linux Rust (gnu, static glibc)
          - config: linux-rust-musl
            target: x86_64-unknown-linux-musl
            rustflags: ""
            name: Linux Rust (musl, static)

    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          apt-get update
          apt-get install -y curl ca-certificates gcc git python3 binutils
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add ${{ matrix.target }}

      - name: Build and stage composites
        working-directory: ttp-composite/linux/rust
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cargo build --locked --release --target ${{ matrix.target }} --workspace
          bash coverage/build.sh ../../../composite-dist/${{ matrix.config }} ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'gnu' || 'musl' }}
          gcc -static -O2 -Wall -Wextra -Werror ../c/coverage/helper.c -o ../../../composite-dist/${{ matrix.config }}/falco_helper
          mkdir -p ../../../composite-dist/${{ matrix.config }}
          for p in reverse_shell imds read_sensitive_file symlink_sensitive clear_log mkdir_bin ptrace_antidebug; do
            cp target/${{ matrix.target }}/release/$p ../../../composite-dist/${{ matrix.config }}/$p
          done

      - name: Upload composites
        uses: actions/upload-artifact@v7
        with:
          name: composite-${{ matrix.config }}
          path: composite-dist/${{ matrix.config }}

  windows-c:
    # Windows C composites: gcc held constant, only the C runtime varies (UCRT
    # vs MSVCRT) via the MSYS2 environment, mirroring build-c.yml's Windows job.
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: windows-c-ucrt
            msystem: UCRT64
            prefix: ucrt-x86_64
            name: Windows C (UCRT)
          - config: windows-c-msvcrt
            msystem: MINGW64
            prefix: x86_64
            name: Windows C (MSVCRT)

    name: ${{ matrix.name }}
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
            mingw-w64-${{ matrix.prefix }}-gcc
            mingw-w64-${{ matrix.prefix }}-cmake
            mingw-w64-${{ matrix.prefix }}-ninja
            mingw-w64-${{ matrix.prefix }}-python

      - name: Configure and build
        working-directory: ttp-composite/windows/c
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Stage composites
        working-directory: ttp-composite/windows/c
        run: cmake --install build --prefix ../../../composite-dist/${{ matrix.config }}

      - name: Verify standalone programs and CRT imports
        run: python ttp-composite/windows/coverage/verify_programs.py composite-dist/${{ matrix.config }}/coverage ${{ matrix.msystem == 'UCRT64' && 'ucrt' || 'msvcrt' }}

      - name: Verify non-network behaviors and same-binary controls
        shell: pwsh
        run: |
          $dist = "composite-dist/${{ matrix.config }}/coverage"
          New-Item -ItemType Directory -Force C:\lab\windows-coverage\fixtures | Out-Null
          Copy-Item "$dist/fixtures/windows_fixture_helper.exe" C:\lab\windows-coverage\fixtures\helper.exe
          Copy-Item "$dist/fixtures/fixture.node" C:\lab\windows-coverage\fixtures\fixture.node
          & ./ttp-composite/windows/coverage/run.ps1 -Programs $dist -Output "${{ runner.temp }}/windows-behavior" -BehaviorOnly

      - name: Upload behavior evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: behavior-${{ matrix.config }}
          path: ${{ runner.temp }}/windows-behavior

      - name: Upload composites
        uses: actions/upload-artifact@v7
        with:
          name: composite-${{ matrix.config }}
          path: composite-dist/${{ matrix.config }}

  windows-cpp:
    # Windows C++ composites: clang++ held constant, only the C++ standard
    # library varies (libstdc++ vs libc++), both on UCRT, mirroring
    # build-cpp.yml's Windows job. The stdlib is dynamically linked, so its DLL
    # is bundled beside the exe.
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: windows-libstdcxx
            config: windows-cpp-libstdcxx
            name: Windows C++ (libstdc++)
          - toolchain: windows-libcxx
            config: windows-cpp-libcxx
            name: Windows C++ (libc++)

    name: ${{ matrix.name }}
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libc++
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Configure and build
        working-directory: ttp-composite/windows/cpp
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=toolchains/${{ matrix.toolchain }}.cmake
          cmake --build build

      - name: Stage composites
        working-directory: ttp-composite/windows/cpp
        run: cmake --install build --prefix ../../../composite-dist/${{ matrix.config }}

      - name: Bundle actual runtime DLL dependencies
        run: python ttp-composite/windows/coverage/bundle_runtime.py composite-dist/${{ matrix.config }}

      - name: Verify standalone programs, C++ library and CRT imports
        run: python ttp-composite/windows/coverage/verify_programs.py composite-dist/${{ matrix.config }}/coverage ${{ matrix.toolchain == 'windows-libstdcxx' && 'libstdcxx' || 'libcxx' }} --compiler clang++

      - name: Verify non-network behaviors and same-binary controls
        shell: pwsh
        run: |
          $dist = "composite-dist/${{ matrix.config }}/coverage"
          New-Item -ItemType Directory -Force C:\lab\windows-coverage\fixtures | Out-Null
          Copy-Item "$dist/fixtures/windows_fixture_helper.exe" C:\lab\windows-coverage\fixtures\helper.exe
          Copy-Item "$dist/fixtures/fixture.node" C:\lab\windows-coverage\fixtures\fixture.node
          & ./ttp-composite/windows/coverage/run.ps1 -Programs $dist -Output "${{ runner.temp }}/windows-behavior" -BehaviorOnly

      - name: Upload behavior evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: behavior-${{ matrix.config }}
          path: ${{ runner.temp }}/windows-behavior

      - name: Upload composites
        uses: actions/upload-artifact@v7
        with:
          name: composite-${{ matrix.config }}
          path: composite-dist/${{ matrix.config }}

  windows-go:
    # Windows Go composites: same CGO on/off axis as Linux, mirroring
    # build-go.yml's Windows job. The composites import golang.org/x/sys, already
    # pinned in ttp-composite/windows/go/go.mod.
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: windows-go-cgo
            cgo: "1"
            name: Windows Go (cgo)
          - config: windows-go-static
            cgo: "0"
            name: Windows Go (pure-Go)

    name: ${{ matrix.name }}
    runs-on: windows-2025
    env:
      CGO_ENABLED: ${{ matrix.cgo }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: ttp-composite/windows/go/go.mod

      # A known UCRT toolchain supplies the cgo runtime and fixed C fixtures.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python

      - name: Build, verify and stage composites
        shell: msys2 {0}
        working-directory: ttp-composite/windows/go
        run: |
          for p in reverse_shell imds registry_run_key startup_folder; do
            go build -o "../../../composite-dist/${{ matrix.config }}/$p.exe" "./$p"
          done
          bash coverage/build.sh ../../../composite-dist/${{ matrix.config }}

      - name: Verify non-network behaviors and same-binary controls
        shell: pwsh
        run: |
          $dist = "composite-dist/${{ matrix.config }}/coverage"
          New-Item -ItemType Directory -Force C:\lab\windows-coverage\fixtures | Out-Null
          Copy-Item "$dist/fixtures/windows_fixture_helper.exe" C:\lab\windows-coverage\fixtures\helper.exe
          Copy-Item "$dist/fixtures/fixture.node" C:\lab\windows-coverage\fixtures\fixture.node
          & ./ttp-composite/windows/coverage/run.ps1 -Programs $dist -Output "${{ runner.temp }}/windows-behavior" -BehaviorOnly

      - name: Upload behavior evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: behavior-${{ matrix.config }}
          path: ${{ runner.temp }}/windows-behavior

      - name: Upload composites
        uses: actions/upload-artifact@v7
        with:
          name: composite-${{ matrix.config }}
          path: composite-dist/${{ matrix.config }}

  windows-rust:
    # Same Rust compiler, MSVC target, SDK and source; vary CRT linkage only.
    strategy:
      fail-fast: false
      matrix:
        crt: [dynamic, static]
    name: Windows Rust (MSVC, ${{ matrix.crt }} CRT)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE) { throw 'Toolchain installation failed' }
          rustup target add x86_64-pc-windows-msvc --toolchain 1.98.1
          if ($LASTEXITCODE) { throw 'Target installation failed' }
      - name: Build, verify and stage standalone programs
        shell: pwsh
        run: ./ttp-composite/windows/rust/build.ps1 -Output "composite-dist/windows-rust-msvc-${{ matrix.crt }}" -Crt '${{ matrix.crt }}'
      - name: Verify non-network behaviors and same-binary controls
        shell: pwsh
        run: |
          $dist = "composite-dist/windows-rust-msvc-${{ matrix.crt }}/coverage"
          New-Item -ItemType Directory -Force C:\lab\windows-coverage\fixtures | Out-Null
          Copy-Item "$dist/fixtures/windows_fixture_helper.exe" C:\lab\windows-coverage\fixtures\helper.exe
          Copy-Item "$dist/fixtures/fixture.node" C:\lab\windows-coverage\fixtures\fixture.node
          & ./ttp-composite/windows/coverage/run.ps1 -Programs $dist -Output "${{ runner.temp }}/windows-behavior" -BehaviorOnly
      - name: Upload behavior evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: behavior-windows-rust-msvc-${{ matrix.crt }}
          path: ${{ runner.temp }}/windows-behavior
      - name: Upload composites
        uses: actions/upload-artifact@v7
        with:
          name: composite-windows-rust-msvc-${{ matrix.crt }}
          path: composite-dist/windows-rust-msvc-${{ matrix.crt }}
