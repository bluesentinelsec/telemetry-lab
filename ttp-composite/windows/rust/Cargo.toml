[package]
name = "windows-detection-composites"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Pipes", "Win32_System_LibraryLoader", "Win32_System_Time", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
debug = 1
strip = false

